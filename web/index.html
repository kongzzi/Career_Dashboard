<!DOCTYPE html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커리어 대시보드</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📘</text></svg>">
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <span class="brand-mark">◧</span>
    <span class="brand-text">커리어<br><b>대시보드</b></span>
  </div>
  <nav id="nav">
    <button class="nav-item is-active" data-view="dashboard"><span class="ni">◉</span>대시보드</button>
    <button class="nav-item" data-view="calendar"><span class="ni">▦</span>월간 캘린더</button>
    <button class="nav-item" data-view="timeline"><span class="ni">▤</span>연간 타임라인</button>
    <button class="nav-item" data-view="timetable"><span class="ni">▥</span>주간 시간표</button>
    <button class="nav-item" data-view="heatmap"><span class="ni">▨</span>연간 히트맵</button>
    <button class="nav-item" data-view="records"><span class="ni">▣</span>일감 목록</button>
    <button class="nav-item" data-view="settings"><span class="ni">⚙</span>설정</button>
  </nav>
  <div class="sidebar-foot">
    <button class="btn btn-ghost btn-sm" id="btn-open-excel">엑셀 파일 열기</button>
    <button class="btn btn-ghost btn-sm" id="btn-theme">테마 전환</button>
    <div class="file-path" id="file-path"></div>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <div class="topbar-left">
      <h1 id="view-title">대시보드</h1>
      <p id="view-sub" class="view-sub"></p>
    </div>
    <div class="topbar-right">
      <div class="seg" id="basis-toggle" role="group" aria-label="수입 집계 기준">
        <button data-basis="accrual">발생기준</button>
        <button data-basis="cash" class="is-active">입금기준</button>
      </div>
      <select id="year-select" class="select" aria-label="연도"></select>
      <button class="btn btn-ghost" id="btn-reload" title="엑셀 다시 읽기">↻</button>
      <button class="btn btn-primary" id="btn-new">+ 새 일감</button>
    </div>
  </header>

  <div class="viewport" id="viewport"></div>
</main>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title">새 일감</h2>
      <button class="icon-btn" id="modal-close" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot">
      <button class="btn btn-danger-ghost" id="btn-delete">삭제</button>
      <span class="spacer"></span>
      <button class="btn btn-ghost" id="btn-cancel">취소</button>
      <button class="btn btn-primary" id="btn-save">저장</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>
<div class="loading" id="loading"><div class="spinner"></div></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
